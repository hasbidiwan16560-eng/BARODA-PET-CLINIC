<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title id="pageTitle">
Baroda Pet Clinic
</title>

<link
rel="stylesheet"
href="style.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<div class="logo-box">

<img
id="siteLogo"
src="images/logo.png"
alt="Logo"
>

<h1 id="clinicName">
Baroda Pet Clinic
</h1>

</div>

<ul>

<li><a href="#">Home</a></li>
<li><a href="#services">Services</a></li>
<li><a href="#gallery">Gallery</a></li>
<li><a href="#booking">Booking</a></li>
<li><a href="#contact">Contact</a></li>

</ul>

</nav>

<!-- HERO -->

<section
class="hero"
id="heroSection"
>

<div class="overlay"></div>

<div class="hero-content">

<h1 id="heroTitle">
Caring For Your Pets
</h1>

<p id="heroDesc">
Professional Pet Care
</p>

<a
href="#booking"
class="hero-btn"
>
Book Appointment
</a>

</div>

</section>

<!-- SERVICES -->

<section
class="services"
id="services"
>

<h2>
Our Services
</h2>

<div
class="services-container"
id="servicesContainer"
>

</div>

</section>

<!-- GALLERY -->

<section
class="gallery"
id="gallery"
>

<h2>
Gallery
</h2>

<div
class="gallery-container"
id="galleryContainer"
>

</div>

</section>

<!-- TESTIMONIALS -->

<section class="testimonials">

<h2>
Testimonials
</h2>

<div
class="testimonial-container"
id="testimonialContainer"
>

</div>

</section>

<!-- BOOKING -->

<section
class="booking"
id="booking"
>

<h2>
Book Appointment
</h2>

<form id="bookingForm">

<input
type="text"
id="name"
placeholder="Your Name"
required
>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required
>

<input
type="text"
id="pet"
placeholder="Pet Type"
required
>

<select id="serviceSelect">
</select>

<input
type="date"
id="date"
required
>

<select id="slotSelect">
</select>

<textarea
id="notes"
placeholder="Notes"
></textarea>

<button type="submit">
Submit Booking
</button>

</form>

</section>

<!-- CONTACT -->

<section
class="contact"
id="contact"
>

<h2>
Contact Us
</h2>

<p id="contactNumber">
+91 9876543210
</p>

</section>

<!-- FOOTER -->

<footer id="footerText">

© 2026 Baroda Pet Clinic

</footer>

<!-- FLOATING WHATSAPP -->

<a
id="floatingWhatsapp"
class="floating-whatsapp"
href="#"
>

<i class="fa-brands fa-whatsapp"></i>

</a>

<script src="script.js"></script>

</body>
</html>
